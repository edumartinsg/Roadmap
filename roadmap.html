function cntI(m){return m.secs.reduce((t,s)=>t+s.i.length,0)}
function cntD(m){return m.secs.flatMap(s=>s.i).filter(x=>ck[x.id]).length}
function toggleI(id,el){ck[id]=!ck[id];save();el.classList.toggle('done',!!ck[id]);el.querySelector('.cb').textContent=ck[id]?'✓':'';updAll();}
function updAll(){
  let tot=0,don=0;
  M.forEach((m,i)=>{
    const t=cntI(m),d=cntD(m);tot+=t;don+=d;
    const pct=t?Math.round(d/t*100):0;
    const pf=document.getElementById('pf'+i),pl=document.getElementById('pl'+i);
    if(pf){pf.style.width=pct+'%';pf.style.background=m.m0?'#1D9E75':(COL[m.cat]||'#534AB7');}
    if(pl)pl.textContent=d+'/'+t;
  });
  const op=tot?Math.round(don/tot*100):0;
  document.getElementById('ov-f').style.width=op+'%';
  document.getElementById('ov-l').textContent=don+' of '+tot+' items complete';
  document.getElementById('ov-p').textContent=op+'%';
}
let activeF='All';
function setFilter(c){
  activeF=c;
  document.querySelectorAll('.fil').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  document.querySelectorAll('.mod').forEach(el=>el.style.display=(c==='All'||el.dataset.cat===c)?'':'none');
}
const filEl=document.getElementById('fil');
CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='fil'+(c==='All'?' on':'');
  b.dataset.c=c;b.textContent=c;
  b.onclick=()=>setFilter(c);
  filEl.appendChild(b);
});
const BADGE_MAP={rs:'cb-rs',ud:'cb-ud',ai:'cb-ai'};
function buildRes(m){
  if(!m.resources)return '';
  let h='';
  m.resources.forEach(rc=>{
    h+=`<div class="res-block"><h4>${rc.cat}</h4>`;
    rc.items.forEach(r=>{
      const badgeCls=r.badge?BADGE_MAP[r.badge]:'';
      const badgeEl=r.badge?`<span class="course-badge ${badgeCls}">${r.badge==='rs'?'Rocketseat':r.badge==='ud'?'Udemy':'Ed Donner AI'}</span>`:'';
      h+=`<div class="res-row"><span class="res-name">${r.name}${badgeEl}${r.n?` <span class="res-sub">(${r.n})</span>`:''}</span><span class="${r.f?'free':'paid'}">${r.f?'free':'paid'}</span></div>`;
    });
    h+='</div>';
  });
  return h;
}
const modEl=document.getElementById('mods');
M.forEach((m,i)=>{
  const tot=cntI(m),don=cntD(m),pct=tot?Math.round(don/tot*100):0;
  const cc=m.m0?'c-pre':(CC[m.cat]||'c-bon');
  const col=m.m0?'#1D9E75':(COL[m.cat]||'#888780');
  let preH=m.pre.map(p=>`<span class="chip-pre">${p}</span>`).join('');
  let relH=m.rel.map(r=>`<span class="chip-rel">${r}</span>`).join('');
  let depH='';
  if(m.pre.length||m.rel.length){
    depH='<div class="dep-row">';
    if(m.pre.length)depH+=`<span class="dlbl">Requires</span>${preH}`;
    if(m.pre.length&&m.rel.length)depH+='<span style="margin:0 4px;color:#b4b2a9">·</span>';
    if(m.rel.length)depH+=`<span class="dlbl">Related</span>${relH}`;
    depH+='</div>';
  }
  let aiH='';
  if(m.ai&&m.cat!=='AI')aiH=`<div class="ai-row"><span>AI connection</span><p>${m.ai}</p></div>`;
  const projH=m.proj?`<div class="proj-box"><h4>Practice project</h4><p>${m.proj.desc}</p><div class="proj-stack">${m.proj.stack.map(s=>`<span class="stag">${s}</span>`).join('')}</div></div>`:'';
  let secH='';
  m.secs.forEach(s=>{
    secH+=`<div class="sec"><div class="stitle"><span class="sdot" style="background:${s.dot||'#888'}"></span>${s.t}</div>`;
    s.i.forEach(it=>{
      const d=!!ck[it.id];
      secH+=`<div class="item${d?' done':''}" id="it-${it.id}" onclick="toggleI('${it.id}',this)"><div class="cb">${d?'✓':''}</div><div><div class="ilbl">${it.l}</div>${it.n?`<div class="inote">${it.n}</div>`:''}</div></div>`;
    });
    secH+='</div>';
  });
  const div=document.createElement('div');
  div.className='mod'+(m.m0?' m0':'');
  div.dataset.cat=m.cat;
  div.innerHTML=`
    <div class="mhd" onclick="this.parentElement.classList.toggle('open')">
      <span class="mnum">${m.n}</span>
      <span class="mtitle">${m.t}</span>
      <span class="mcat ${cc}">${m.cat}</span>
      <span class="mprg"><span id="pl${i}">${don}/${tot}</span></span>
      <span class="marr">▾</span>
    </div>
    <div class="mbody">
      ${depH}${aiH}
      <div class="pbar"><div class="pfill" id="pf${i}" style="width:${pct}%;background:${col}"></div></div>
      ${projH}${secH}
      ${buildRes(m)}
    </div>`;
  modEl.appendChild(div);
});
updAll();
</script>
